# Rust Type Facts producer, built beside the Go one (apps/solid-typefacts)
# until the migration switches the default. Its own workspace, lockfile and
# target directory keep the compiler dependencies that arrive in later slices
# (tsrs, ~79 crates) out of rust/target and out of rust/'s unsafe_code = "deny"
# policy. See the migration plan, section 6.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "solid-typefacts"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99.1"
description = "Type Facts v3 lifecycle producer (Rust)"

[lib]
name = "solid_typefacts"
path = "src/lib.rs"

[[bin]]
name = "solid-typefacts"
path = "src/main.rs"

# Test double for process-level tests; see src/fake.rs.
[[bin]]
name = "solid-typefacts-fake"
path = "src/bin/solid-typefacts-fake.rs"

[lints.rust]
# Denied, not forbidden: the one `unsafe_boundary` module allows it narrowly
# (tsrs frees memory through unsafe calls; see src/unsafe_boundary.rs).
unsafe_code = "deny"

[features]
# The wasm32-wasip1 reactor exports (src/unsafe_boundary.rs, `reactor_exports`).
# Build the module with `scripts/build-typefacts-reactor.sh`.
reactor = []

[dependencies]
# Protocol constants, request/response types and the deterministic CBOR codec
# come from the client crate, so a producer/client mismatch fails to compile.
typefacts = { path = "../../rust/crates/typefacts", features = ["producer"] }
ciborium = "0.2"
sha2 = "0.10"

# The compiler: tsrs at the solid-checker fork. Upstream oxc-project/tsrs@467182f
# (TypeScript b85298b6a81f, 7.1.0-dev) plus one marked commit exporting
# is_untyped_function_call and get_reduced_apparent_type. Never another rev.
tsrs_core = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_ast = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_checker = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_compiler = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_tsoptions = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_scanner = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_contentmapper = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_diagnostics = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }
tsrs_vfs = { git = "https://github.com/yumemi-thomas/tsrs", rev = "49f534856809ad8d5a596123f02175ba01675c8d" }

# The allocator of tsrs's own binaries, same features: the producer frees whole
# program chains and checkers, and the system allocator keeps that memory
# resident (macOS: RSS 1.5 GiB after 200 edits of a 557-file project, against
# 0.75 GiB here). Native only: wasm32 keeps wasi-libc's allocator.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc-safe = { version = "0.1.67", features = ["v3", "no_thp"] }

# Dependencies (the codec now, tsrs later) run optimized even in dev builds:
# an unoptimized compiler front end is unusably slow. Workspace code stays at
# opt-level 0 for fast iteration.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Inner loop for memory and latency work: release code generation without the
# fat-LTO relink (about 50 s per change). Allocator and RSS behaviour do not
# depend on LTO; use `--release` for the numbers that get reported.
[profile.bench-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
