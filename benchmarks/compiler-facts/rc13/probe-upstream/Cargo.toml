[package]
name = "compiler-rc13-upstream-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "compiler-rc13-upstream-probe"
path = "../probe/src/main.rs"

[features]
trace = []

[dependencies]
solidjs-compiler = { path = "../../../../rust/target/compiler-rc13-upstream/packages/compiler", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
