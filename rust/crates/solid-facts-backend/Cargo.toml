[package]
name = "solid-facts-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
autobins = false
autotests = false

[lints]
workspace = true

[features]
default = ["dialect-v2"]
dialect-v2 = ["dep:solid-v2-compiler", "dep:solid-v2-rules"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
oxc_diagnostics.workspace = true
oxc_miette.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
solid-dialect = { path = "../solid-dialect" }
solid-facts = { path = "../solid-facts" }
solid-v2-compiler = { path = "../../dialects/solid-v2/compiler", optional = true }
typefacts.workspace = true
solid-reactive-ir = { path = "../solid-reactive-ir" }
solid-v2-rules = { path = "../../dialects/solid-v2/rules", optional = true }
thiserror.workspace = true

[lib]
name = "solid_facts_backend"
path = "src/lib.rs"

[[bin]]
name = "solid-checker-rust"
path = "src/main.rs"

[[bin]]
name = "solid-checker-session-bench"
path = "src/bin/solid-checker-session-bench.rs"

[[bin]]
name = "solid-checker-cold-start-bench"
path = "src/bin/solid-checker-cold-start-bench.rs"

# Keep the two focused process boundaries addressable by the verification
# matrix, but link the remaining integration modules once. Each root-level
# tests/*.rs file used to become a separate 45-55 MiB executable even when the
# module contained only a handful of tests.
[[test]]
name = "diagnostics_process"
path = "tests/diagnostics_process.rs"

[[test]]
name = "dialects_process"
path = "tests/dialects_process.rs"

[[test]]
name = "backend_process"
path = "tests/backend_process.rs"
