[package]
name = "solid-facts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# ADR 1152: a measurement build. Every read of a name's source text that holds an escape (`FileFacts::source_text`) is recorded with the Rust call site that made it
# (`SOLID_CHECKER_RAW_NAME_TRACE=<file>`). Never in `default`; the sweep (scripts/fuzz/escape-sweep.mjs) builds it to name the sites that read a name as written.
raw-name-trace = []

[dependencies]
compact_str.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_span.workspace = true
oxc_syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
typefacts.workspace = true
