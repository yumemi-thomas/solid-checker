[package]
name = "solid-checker-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
test = false
doctest = false

[dependencies]
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
solid-facts-backend = { path = "../solid-facts-backend" }
typefacts.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# The wasm cdylib needs the compiler's Node-API registrations linked in, so
# this one keeps the crate's default `node` feature.
dom-expressions-compiler = { workspace = true, features = ["node"] }

[build-dependencies]
napi-build = "2"
