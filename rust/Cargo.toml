[workspace]
resolver = "2"
members = [
  "crates/solid-dialect",
  "crates/solid-facts",
  "crates/solid-reactive-ir",
  "crates/solid-facts-backend",
  "crates/solid-checker-wasm",
  "crates/napi-build-host-aware",
  "crates/typefacts",
  "dialects/solid-v2/compiler",
  "dialects/solid-v2/rules",
]

[patch.crates-io]
# The Solid compiler fork's build.rs still calls napi-build when its optional
# `node` feature is disabled. The host-aware shim advertises napi-build 2.4.1
# for dependency resolution, retains the audited emnapi 1.x WASI link behavior,
# and suppresses only that invalid WASI cdylib registration edge.
napi-build = { path = "crates/napi-build-host-aware" }

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99.1"

# Unsafe code is denied everywhere. A crate with a real FFI boundary confines it
# to one `unsafe_boundary` module carrying `#[allow(unsafe_code)]`; every other
# crate root also says `#![forbid(unsafe_code)]`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
rustc-hash = "2.1.3"
parking_lot = "0.12"
# Solid 2 compiler facts come from the semantic-only fork of the compiler now
# owned by solidjs/solid. This exact fork commit is based on upstream `next` at
# `5b1b7776` (published rc.17) and adds only trace models, output-neutral
# recording hooks, validation/serialization, and fact tests. Its 373-entry generated-output
# baseline is byte-identical to that exact upstream base. No upstream PR is
# opened for this fork; compiler behavior fixes remain outside this branch.
# The producer carries `SEMANTIC_TRACE_VERSION = 3`; the adapter has an
# independent literal and const assertion so an incompatible pin cannot build.
solidjs-compiler = { git = "https://github.com/yumemi-thomas/solid", rev = "9f5fff59c2abc4465058d96080771c82dfd91990", default-features = false }
# Moved from `3296ec8` for the signature-less `Function`-supertype answer
# (producer ADR 0021): wire table schema 15, handshake protocol still 2.
# `Callability::UntypedCallable` is positive runtime-function evidence without
# claiming a readable signature; the kind proof and keyed-control discovery
# consume it beside `Callable`. `Constructability` remains unchanged.
typefacts = { path = "crates/typefacts" }
ciborium = "0.2"
compact_str = { version = "0.9.1", features = ["serde"] }
oxc_allocator = "0.118"
oxc_ast = "0.118"
oxc_ast_visit = "0.118"
oxc_diagnostics = "0.118"
oxc_parser = "0.118"
oxc_semantic = "0.118"
oxc_span = "0.118"
oxc_syntax = "0.118"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_bytes = "0.11"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
oxc_miette = { package = "oxc-miette", version = "2.7" }
sha2 = "0.10"
thiserror = "2"

# Third-party crates carry no debug info and workspace crates only line
# tables: enough for backtraces with line numbers. Full DWARF on macOS keeps
# every object file (about 175k files, 21 GB in rust/target/debug), which made
# cloning a target for a parallel worktree slow. For a debugger session, build
# with `--profile debugger`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

# Linux derives the daemon identity by hashing the whole executable; unoptimized
# SHA-256 over a debug binary takes seconds and outlasts the idle-watchdog test's
# window (the client's start-up, not the daemon, was the slow part).
[profile.dev.package.sha2]
opt-level = 3

[profile.debugger]
inherits = "dev"
debug = 2

# `make verify` builds in `dev` too (scripts/verify.sh), so a handoff reuses the
# edit loop's incremental build rather than compiling the workspace again in a
# profile of its own.
