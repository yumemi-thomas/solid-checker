[workspace]
resolver = "2"
members = [
  "crates/solid-dialect",
  "crates/solid-facts",
  "crates/solid-reactive-ir",
  "crates/solid-facts-backend",
  "crates/solid-checker-wasm",
  "crates/napi-build-host-aware",
  "dialects/solid-v1/compiler",
  "dialects/solid-v1/rules",
  "dialects/solid-v2/compiler",
  "dialects/solid-v2/rules",
]

[patch.crates-io]
# solid-1x-compiler's build.rs still calls napi-build when its optional `node`
# feature is disabled. The host-aware shim advertises napi-build 2.4.1 for
# dependency resolution, retains the audited emnapi 1.x WASI link behavior,
# and suppresses only that invalid WASI cdylib registration edge.
napi-build = { path = "crates/napi-build-host-aware" }

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97"

[workspace.dependencies]
# The JSX compiler lives in its own repository now and is pinned by revision:
# reproducible builds matter more here than picking up upstream
# automatically.
# Pinned to the tested head of fork PR #4, based on upstream `next` at
# `e109692b9b50e20511091d9ce324ebc660b4ca32` (0.50.0-next.44). The PR ports
# the reactive-ownership prerequisite and the three compiler-contract fixes
# that had landed on `main`, preserving `next`'s newer Oxc and server-component
# work. It stops constant-folded `on*`/`ref`/`children` attributes from leaving
# mismatched census sites and failing the whole file.
# This rev carries `SEMANTIC_TRACE_VERSION = 2`: the trace gained the additive
# wrapper vocabulary (`owner_establishments`, `component_render_sites`,
# `deferred_callback_sites`) and a `version` field the consumer must check.
# 2.0 deliberately keeps emitting the legacy `ownership_sites` field, so
# rust/dialects/solid-v2/compiler still reads it; the 1.x fork dropped it.
# Bumping this rev to a producer with a different schema version fails the
# build: each adapter holds `READS_TRACE_VERSION` — its own literal, never the
# producer's constant — equal to `SEMANTIC_TRACE_VERSION` in a const assert.
# That is deliberate. Fix the projection for the new schema, then move both the
# rev and the literal.
# The port includes fork PR #2 (`fix/void-child-census`):
# the semantic-trace census now includes a *nested* void element's children,
# which the fork's transform really does lower -- a deliberate parity
# divergence from Babel, which deletes them -- and the textarea `value` fold
# and the inert `<noscript>` fast path retract the children they discard. The
# fork's docs/execution-contract.md names every divergence with a binding
# consumer rule; the two this checker mitigates are in docs/compiler-facts.md,
# "Divergent lowering", implemented by `divergent_lowered_child` in
# rust/crates/solid-reactive-ir/src/execution_role.rs.
# It also includes fork PR #3 (`fix/nested-children-attribute-promotion`),
# resolving divergence 4: a `children` attribute on a nested
# native element with no source children now promotes to a real child insert,
# the way a template-root `children` attribute always has, instead of naming a
# `jsx-child` census site nested lowering never resolved (a hard
# reconciliation failure -- `solid-checker-rust` exited 2 and the file was
# never analyzed). The fix also corrects a latent dedup bug in
# `children_attribute_container` (name-first selection, matching Babel's own
# attribute dedup, so a trailing literal `children` duplicate blocks
# promotion instead of falling through to an earlier non-literal one) present
# in the template-root path too. Divergences 5-9 remain open: none of them
# reaches a rule in this checker yet, and each is recorded with its emitted-code
# evidence in docs/precision-backlog.md ("Divergence 4 is resolved, and it
# surfaced five more"), with divergence 5's certification residue tracked there
# as open. See docs/compiler-facts.md for the divergences this checker does
# mitigate. The only `next`-specific trace adaptation is a DOM-mode dynamic
# intrinsic `$key`: lowering strips the server-component identity attribute,
# so the trace now resolves its value as `Elided` instead of leaving the census
# open. `SEMANTIC_TRACE_VERSION` remains 2.
dom-expressions-compiler = { git = "https://github.com/yumemi-thomas/dom-expressions", rev = "eabc563d812e9854d67cee63777483df150538cc", default-features = false }
# The Solid 1.x compiler: the same crate name from its own repository, kept at
# differential parity with the Babel compiler Solid 1.x ships. The renamed key
# is how one workspace holds both; each dialect's compiler crate depends on
# exactly one of them.
# Pinned to `main` (the census branch is merged into it): the same fix as
# above, plus the two upstream correctness fixes that apply to 1.x (the
# linear deferred JSX pass and the directive-DCE type-only removal).
# Parity target is babel-plugin-jsx-dom-expressions@0.40.10. Upstream's
# 0.40.7 -> 0.40.10 delta is four changes: the SSR attribute-position
# template-quasi escape (an attribute-injection fix), the
# `omitServerOnlyTemplates` option defaulting to true, `wrapConditionals`
# applying to SSR component props, and the vendored-oracle bump. Upstream's
# hydration-id codegen change remains deliberately absent -- none of those four
# touches hydration-id allocation, so this target does not pull it in.
# This rev also carries the two census/lowering reconciliation fixes the
# ecosystem benchmark surfaced (see docs/precision-backlog.md): `style`/
# `classList` decomposition now follows the same positional spread carve-out
# lowering uses, and fragment children are classified from a span set instead of
# a flag that leaked through attribute values. Both are census-only, so emitted
# output is byte-identical across them.
# This rev carries `SEMANTIC_TRACE_VERSION = 2` and *removes* the
# `ownership_sites` / `OwnershipDecision` vocabulary in favor of the additive
# wrapper facts (`owner_establishments`, `component_render_sites`,
# `deferred_callback_sites`). The reactive-ownership regions this checker
# requires are therefore derived in rust/dialects/solid-v1/compiler now — the
# same rule the producer used to apply, reactive-rerun sites under the default
# effect wrapper — so that derivation must move with this rev, not after it.
# The same const assert guards this side: rust/dialects/solid-v1/compiler holds
# its own `READS_TRACE_VERSION` literal equal to the producer's constant, so a
# schema bump fails the build rather than being read as if nothing changed.
# The current rev additionally carries the nested `children`-attribute
# promotion fixes and retracts trace rows inside every subtree lowering later
# discards (including static `<noscript>` and hydratable `<head>` paths). The
# latter is trace-only: emitted JavaScript and `SEMANTIC_TRACE_VERSION = 2`
# remain unchanged, while file-level exit-2 census gaps are closed.
solid1-dom-expressions-compiler = { package = "dom-expressions-compiler", git = "https://github.com/yumemi-thomas/solid-1x-compiler", rev = "d1e089581231b3028b7e8ce838ceed0f3c83e154", default-features = false }
# Moved from `3296ec8` for the signature-less `Function`-supertype answer
# (producer ADR 0021): wire table schema 15, handshake protocol still 2.
# `Callability::UntypedCallable` is positive runtime-function evidence without
# claiming a readable signature; the kind proof and keyed-control discovery
# consume it beside `Callable`. `Constructability` remains unchanged.
typefacts = { git = "https://github.com/yumemi-thomas/solid-ts-facts", rev = "19671a889b273da135024722c5957b8979e43fbb" }
compact_str = { version = "0.9.1", features = ["serde"] }
oxc_allocator = "0.118"
oxc_ast = "0.118"
oxc_ast_visit = "0.118"
oxc_diagnostics = "0.118"
oxc_parser = "0.118"
oxc_semantic = "0.118"
oxc_span = "0.118"
oxc_syntax = "0.118"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
oxc_miette = { package = "oxc-miette", version = "2.7" }
sha2 = "0.10"
thiserror = "2"
