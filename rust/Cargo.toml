[workspace]
resolver = "2"
members = [
  "crates/solid-dialect",
  "crates/solid-facts",
  "crates/solid-reactive-ir",
  "crates/solid-facts-backend",
  "crates/solid-checker-wasm",
  "dialects/solid-v1/compiler",
  "dialects/solid-v1/rules",
  "dialects/solid-v2/compiler",
  "dialects/solid-v2/rules",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97"

[workspace.dependencies]
# The JSX compiler lives in its own repository now and is pinned by revision:
# `dom-expressions` is tracked on a feature branch, and reproducible builds
# matter more here than picking up upstream automatically.
# Pinned to `fix-elided-event-handler-census`, which stops a constant-folded
# `on*` attribute leaving an undecided census site and failing the whole file.
dom-expressions-compiler = { git = "https://github.com/yumemi-thomas/dom-expressions", rev = "bc8e23e7097877dac664ff38538b69e0ba5c4c53", default-features = false }
# The Solid 1.x compiler: the same crate name from its own repository, kept at
# differential parity with the Babel compiler Solid 1.x ships. The renamed key
# is how one workspace holds both; each dialect's compiler crate depends on
# exactly one of them.
# Pinned to `fix-elided-event-handler-census`, the same fix as above.
solid1-dom-expressions-compiler = { package = "dom-expressions-compiler", git = "https://github.com/yumemi-thomas/solid-1x-compiler", rev = "7fd5684e17ad1319cf5498524c3547f6b0e0e8a4", default-features = false }
typefacts = { git = "https://github.com/yumemi-thomas/solid-ts-facts", rev = "d708b506bebaa0ea81e061a0d4dd27100c42a433" }
ciborium = "0.2"
compact_str = { version = "0.9.1", features = ["serde"] }
oxc_allocator = "0.118"
oxc_ast = "0.118"
oxc_ast_visit = "0.118"
oxc_diagnostics = "0.118"
oxc_parser = "0.118"
oxc_span = "0.118"
oxc_syntax = "0.118"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
oxc_miette = { package = "oxc-miette", version = "2.7" }
sha2 = "0.10"
thiserror = "2"
