[workspace]
resolver = "2"
members = [
  "crates/solid-dialect",
  "crates/solid-facts",
  "crates/solid-reactive-ir",
  "crates/solid-facts-backend",
  "crates/solid-checker-wasm",
  "crates/napi-build-host-aware",
  "dialects/solid-v1/compiler",
  "dialects/solid-v1/rules",
  "dialects/solid-v2/compiler",
  "dialects/solid-v2/rules",
]

[patch.crates-io]
# solid-1x-compiler's build.rs still calls napi-build when its optional `node`
# feature is disabled. The host-aware shim preserves napi-build 2.3.2 everywhere
# else and suppresses only that invalid WASI cdylib registration edge.
napi-build = { path = "crates/napi-build-host-aware" }

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.97"

[workspace.dependencies]
# The JSX compiler lives in its own repository now and is pinned by revision:
# reproducible builds matter more here than picking up upstream
# automatically.
# Pinned to `main` (the semantic-trace and census branches are merged into
# it), which stops a constant-folded `on*`/`ref`/`children` attribute
# leaving a mismatched census site and failing the whole file, and carries
# upstream `next` at 0.50.0-next.42 for Solid 2.0 RC.0, merged through
# `598606109208aad35f100060789910876b7e6fc4` while retaining the semantic
# ownership trace required by this checker.
dom-expressions-compiler = { git = "https://github.com/yumemi-thomas/dom-expressions", rev = "b0965a934120d238dfefbc04274f5e6c9c55387f", default-features = false }
# The Solid 1.x compiler: the same crate name from its own repository, kept at
# differential parity with the Babel compiler Solid 1.x ships. The renamed key
# is how one workspace holds both; each dialect's compiler crate depends on
# exactly one of them.
# Pinned to `main` (the census branch is merged into it): the same fix as
# above, plus the two upstream correctness fixes that apply to 1.x (the
# linear deferred JSX pass and the directive-DCE type-only removal);
# upstream's hydration-id
# codegen change is deliberately absent because 1.x parity means matching
# babel-plugin-jsx-dom-expressions@0.40.7 exactly.
solid1-dom-expressions-compiler = { package = "dom-expressions-compiler", git = "https://github.com/yumemi-thomas/solid-1x-compiler", rev = "79b9b63721c59b0acfd72348438bbb6e090ec81c", default-features = false }
typefacts = { git = "https://github.com/yumemi-thomas/solid-ts-facts", rev = "3d51c40407b4de4490230eb298f9896dac3b0fc4" }
compact_str = { version = "0.9.1", features = ["serde"] }
oxc_allocator = "0.118"
oxc_ast = "0.118"
oxc_ast_visit = "0.118"
oxc_diagnostics = "0.118"
oxc_parser = "0.118"
oxc_semantic = "0.118"
oxc_span = "0.118"
oxc_syntax = "0.118"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
oxc_miette = { package = "oxc-miette", version = "2.7" }
sha2 = "0.10"
thiserror = "2"
