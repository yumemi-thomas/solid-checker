name: Performance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Regression benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The relative gate builds the merge base in a worktree.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: performance
          # A pull request's cache scope is unreadable from main, and writing it
          # evicts the entries on main that every run restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/typefacts

      # Which commit this job races against, resolved before anything is built
      # so that commit's benchmark runtime can be looked up in the cache.
      - id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          else
            base=$(git rev-parse HEAD^)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # A benchmark runtime is a bench binary paired with the producer the same
      # commit pinned, and this workflow used to build each one twice: once as
      # the head of that commit's own run, once as the base of the next. Caching
      # it under the commit sha collapses that to one build -- a linear series
      # on main, and every re-push to a branch whose merge base has not moved,
      # stop rebuilding a pair this workflow has already produced.
      #
      # The directory carries the sha because a cache entry restores to the path
      # it was archived from: keying and locating on the same sha is what keeps
      # the base's restore path identical to the path some earlier run's head
      # was saved from.
      - id: base-runtime
        uses: actions/cache@v4
        with:
          path: |
            /tmp/perf-runtime/${{ steps.base.outputs.sha }}/bench
            /tmp/perf-runtime/${{ steps.base.outputs.sha }}/solid-typefacts
          key: perf-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.base.outputs.sha }}

      - name: Build the benchmark runtime
        run: |
          cargo build --release --manifest-path rust/Cargo.toml \
            -p solid-facts-backend --bin solid-checker-session-bench

      - name: Certify absolute performance invariants
        env:
          SOLID_TYPEFACTS_BIN: ${{ github.workspace }}/bin/solid-typefacts
          # Shared runners currently vary from about 165-193us/source for the
          # same analyzer. Keep this as a gross absolute guard; the interleaved
          # base/head comparison below is the regression gate.
          SOLID_CHECKER_MAX_FIRST_IR_NS_PER_SOURCE: 225000
        run: bun benchmarks/verify-performance.mjs

      # The relative gate: race the merge base against the head on this same
      # runner, interleaved so scheduler drift cancels. Pull requests compare
      # their merge base; pushes and manual runs compare the preceding main
      # commit. This is what catches a 26ms -> 60ms regression that still clears
      # the shared-runner absolute ceiling above. Only the two binaries are
      # cached, never a measurement: both sides are still timed here, on one
      # machine, in this run.
      - name: Check out the merge base
        if: steps.base-runtime.outputs.cache-hit != 'true'
        run: git worktree add /tmp/perf-base "${{ steps.base.outputs.sha }}"

      # Build from whichever ownership model the base commit used. This branch's
      # first merge base predates repatriation and therefore still carries the
      # legacy revision-pinned builder; later bases build local source.
      - name: Build the merge-base Type Facts producer
        if: steps.base-runtime.outputs.cache-hit != 'true'
        run: |
          cd /tmp/perf-base
          TYPEFACTS_BUILD_ID=dev scripts/build-typefacts.sh

      - name: Build the merge-base benchmark runtime
        if: steps.base-runtime.outputs.cache-hit != 'true'
        run: |
          cd /tmp/perf-base
          cargo build --release --manifest-path rust/Cargo.toml \
            -p solid-facts-backend --bin solid-checker-session-bench
          runtime=/tmp/perf-runtime/${{ steps.base.outputs.sha }}
          mkdir -p "$runtime"
          cp rust/target/release/solid-checker-session-bench "$runtime/bench"
          cp bin/solid-typefacts "$runtime/solid-typefacts"

      - name: Compare performance with the merge base
        run: |
          runtime=/tmp/perf-runtime/${{ steps.base.outputs.sha }}
          bun benchmarks/compare-performance.mjs \
            --base-bench "$runtime/bench" \
            --base-typefacts "$runtime/solid-typefacts" \
            --head-bench rust/target/release/solid-checker-session-bench \
            --head-typefacts bin/solid-typefacts

      # This commit's own pair, saved under its sha, is what the next commit on
      # main resolves as its base. Main only: a pull request's next push
      # resolves a new head sha, so the entry would never be read.
      - name: Stage this commit's runtime as a future base
        if: github.ref == 'refs/heads/main'
        run: |
          runtime=/tmp/perf-runtime/${{ github.sha }}
          mkdir -p "$runtime"
          cp rust/target/release/solid-checker-session-bench "$runtime/bench"
          cp bin/solid-typefacts "$runtime/solid-typefacts"
      - name: Publish this commit's runtime as a future base
        if: github.ref == 'refs/heads/main'
        # A re-run of an already-published commit finds its own entry present.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/perf-runtime/${{ github.sha }}/bench
            /tmp/perf-runtime/${{ github.sha }}/solid-typefacts
          key: perf-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Prepare the deterministic corpus
        run: |
          bun benchmarks/generate-bench-corpus.mjs \
            1000 /tmp/solid-checker-codspeed-corpus

      # This analysis spans the Rust process and the Type Facts child process.
      # CodSpeed CPU simulation does not follow child processes, so wall time is
      # the correct end-to-end instrument here.
      # Optional extra beyond the merge-base comparison above: enable after
      # registering the repository with CodSpeed by setting the repository
      # variable CODSPEED_ENABLED to true.
      - name: Compare performance with the base commit on CodSpeed
        if: vars.CODSPEED_ENABLED == 'true'
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          config: codspeed.yml
        env:
          SOLID_CHECKER_CODSPEED_CORPUS: /tmp/solid-checker-codspeed-corpus
          SOLID_TYPEFACTS_BIN: ${{ github.workspace }}/bin/solid-typefacts
