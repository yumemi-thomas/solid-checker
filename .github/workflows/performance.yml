name: Performance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Regression benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The relative gate builds the merge base in a worktree.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: performance

      - name: Build the benchmark runtime
        run: |
          scripts/build-typefacts.sh
          cargo build --release --manifest-path rust/Cargo.toml \
            -p solid-facts-backend --bin solid-checker-session-bench

      - name: Certify absolute performance invariants
        env:
          SOLID_TYPEFACTS_BIN: ${{ github.workspace }}/bin/solid-typefacts
        run: node benchmarks/verify-performance.mjs

      # The relative gate: build the merge base in a worktree and race it
      # against the head on this same runner, interleaved so scheduler drift
      # cancels. This is what catches a 26ms -> 60ms regression that still
      # clears the shared-runner absolute ceiling above.
      - name: Build the merge-base benchmark runtime
        if: github.event_name == 'pull_request'
        run: |
          base=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          git worktree add /tmp/perf-base "$base"
          cd /tmp/perf-base
          scripts/build-typefacts.sh
          cargo build --release --manifest-path rust/Cargo.toml \
            -p solid-facts-backend --bin solid-checker-session-bench

      - name: Compare performance with the merge base
        if: github.event_name == 'pull_request'
        run: |
          node benchmarks/compare-performance.mjs \
            --base-bench /tmp/perf-base/rust/target/release/solid-checker-session-bench \
            --base-typefacts /tmp/perf-base/bin/solid-typefacts \
            --head-bench rust/target/release/solid-checker-session-bench \
            --head-typefacts bin/solid-typefacts

      - name: Prepare the deterministic corpus
        run: |
          node benchmarks/generate-bench-corpus.mjs \
            1000 /tmp/solid-checker-codspeed-corpus

      # This analysis spans the Rust process and the Type Facts child process.
      # CodSpeed CPU simulation does not follow child processes, so wall time is
      # the correct end-to-end instrument here.
      # Optional extra beyond the merge-base comparison above: enable after
      # registering the repository with CodSpeed by setting the repository
      # variable CODSPEED_ENABLED to true.
      - name: Compare performance with the base commit on CodSpeed
        if: vars.CODSPEED_ENABLED == 'true'
        uses: CodSpeedHQ/action@v4
        with:
          mode: walltime
          config: codspeed.yml
        env:
          SOLID_CHECKER_CODSPEED_CORPUS: /tmp/solid-checker-codspeed-corpus
          SOLID_TYPEFACTS_BIN: ${{ github.workspace }}/bin/solid-typefacts
