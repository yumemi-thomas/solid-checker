name: Fuzz trial

# A trial of the differential fuzzer on GitHub-hosted runners: the binaries are
# built once, then one focus run (scripts/fuzz/focus.mjs) per matrix entry runs
# in parallel, to measure scaling and a recall grid's memory on a 4-vCPU,
# 16 GB runner. Provisioning mirrors scripts/fuzz/vm.sh setup and sync.

on:
  push:
    branches: [claude/gha-fuzz-trial]

permissions:
  contents: read

jobs:
  build:
    # ubuntu-22.04 x64 so the release dependency cache main's rust-package job
    # writes (shared-key release-ubuntu-22.04-x64) restores here.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: echo "TSRS_REV=$(sed -n 's/^tsrs_core = .*rev = "\([0-9a-f]*\)".*/\1/p' apps/solid-typefacts/Cargo.toml)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-ubuntu-22.04-x64
          save-if: false
      # Producer with build id dev, the id cargo's [env] gives the checker below.
      - uses: ./.github/actions/typefacts
      # The type checker the fuzzer requires (never tsc from node_modules).
      - id: tsrs-cache
        uses: actions/cache@v4
        with:
          path: ~/tsrs-bin
          key: tsrs-cli-${{ env.TSRS_REV }}-rust-1.99.1-ubuntu-22.04
      - name: Build tsrs CLI
        if: steps.tsrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/yumemi-thomas/tsrs "$RUNNER_TEMP/tsrs"
          git -C "$RUNNER_TEMP/tsrs" checkout -q --detach "$TSRS_REV"
          (cd "$RUNNER_TEMP/tsrs" && cargo +1.99.1 build --release -q -p tsrs_cli)
          mkdir -p ~/tsrs-bin && cp "$RUNNER_TEMP/tsrs/target/release/tsrs" ~/tsrs-bin/
      - name: Build the release checker
        run: cargo +1.99.1 build --release --manifest-path rust/Cargo.toml -p solid-facts-backend --bin solid-checker-rust
      - name: Collect binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bins"
          cp rust/target/release/solid-checker-rust bin/solid-typefacts ~/tsrs-bin/tsrs "$RUNNER_TEMP/bins/"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ runner.temp }}/bins
          retention-days: 3

  focus:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: flush-whole, codes: FLUSH_IN_ACTION, grids: "mx-base,mx-src,mx-combo,lg-base,lg-src,lg-combo", shard: "" }
          - { name: flush-shard-0, codes: FLUSH_IN_ACTION, grids: "mx-base,mx-src,mx-combo,lg-base,lg-src,lg-combo", shard: "0/2" }
          - { name: flush-shard-1, codes: FLUSH_IN_ACTION, grids: "mx-base,mx-src,mx-combo,lg-base,lg-src,lg-combo", shard: "1/2" }
          - { name: store-recall-shard, codes: STORE_WRITE_OUTSIDE_SETTER, grids: "mx-recall", shard: "0/20" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ runner.temp }}/bins
      - name: Installs and Chrome
        run: |
          chmod +x "$RUNNER_TEMP"/bins/*
          (cd scripts/fuzz/install && npm ci --silent)
          (cd scripts/runtime-oracle-install && npm ci --silent)
          (cd packages/cli && bun install --frozen-lockfile --silent)
          (cd scripts/runtime-oracle-install && ./node_modules/.bin/playwright install --with-deps chromium-headless-shell)
      - name: Focus run
        env:
          SOLID_CHECKER_TSRS_BIN: ${{ runner.temp }}/bins/tsrs
        run: |
          bins="$RUNNER_TEMP/bins"
          # Peak memory of the whole machine, sampled every 10 s.
          ( peak=0; while sleep 10; do used=$(free -m | awk '/^Mem:/{print $3}'); [ "$used" -gt "$peak" ] && peak=$used && echo "$peak" > "$RUNNER_TEMP/mem-peak"; done ) &
          start=$(date +%s)
          status=0
          shard=()
          [ -n "${{ matrix.shard }}" ] && shard=(--shard "${{ matrix.shard }}")
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" node scripts/fuzz/focus.mjs --codes "${{ matrix.codes }}" --grids "${{ matrix.grids }}" "${shard[@]}" \
            --split-codes --prune-cases --grid-timeout 290 --out "$RUNNER_TEMP/fuzz-out" \
            --checker-bin "$bins/solid-checker-rust" --typefacts "$bins/solid-typefacts" || status=$?
          echo "focus run: $(( $(date +%s) - start )) s, exit $status"
          grep -E "Maximum resident|Elapsed" "$RUNNER_TEMP/time.txt"
          echo "machine memory peak: $(cat "$RUNNER_TEMP/mem-peak" 2>/dev/null) MiB used"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-out-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/fuzz-out/**/*.json
            ${{ runner.temp }}/fuzz-out/**/*.jsonl
            ${{ runner.temp }}/fuzz-out/**/*.log
          if-no-files-found: warn

  # The two shards of FLUSH_IN_ACTION are the whole run: the same programs (no overlap, none missing) with the same outcomes.
  shard-union:
    needs: focus
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: fuzz-out-flush-whole, path: whole }
      - uses: actions/download-artifact@v4
        with: { name: fuzz-out-flush-shard-0, path: s0 }
      - uses: actions/download-artifact@v4
        with: { name: fuzz-out-flush-shard-1, path: s1 }
      - name: Compare
        run: |
          cat > union.mjs <<'JS'
          import { readdirSync, readFileSync } from "node:fs";
          import { join, relative } from "node:path";
          const rows = (root) => {
            const out = new Map();
            const walk = (dir) => { for (const e of readdirSync(dir, { withFileTypes: true })) {
              const p = join(dir, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.name === "programs.jsonl") for (const line of readFileSync(p, "utf8").split("\n").filter(Boolean)) {
                const row = JSON.parse(line); const key = `${relative(root, dir)}|${row.id}`;
                if (out.has(key)) throw new Error(`duplicate ${key}`);
                out.set(key, row.outcome);
              }
            } };
            walk(root); return out;
          };
          const whole = rows("whole"), s0 = rows("s0"), s1 = rows("s1");
          const overlap = [...s0.keys()].filter((k) => s1.has(k));
          const union = new Map([...s0, ...s1]);
          const missing = [...whole.keys()].filter((k) => !union.has(k));
          const extra = [...union.keys()].filter((k) => !whole.has(k));
          const moved = [...whole].filter(([k, o]) => union.has(k) && union.get(k) !== o);
          console.log(`whole ${whole.size}, shard 0 ${s0.size}, shard 1 ${s1.size}; overlap ${overlap.length}, missing ${missing.length}, extra ${extra.length}, outcome differs ${moved.length}`);
          for (const k of [...overlap, ...missing, ...extra].slice(0, 10)) console.log(`  ${k}`);
          for (const [k, o] of moved.slice(0, 10)) console.log(`  ${k}: whole ${o}, shard ${union.get(k)}`);
          if (!whole.size || overlap.length || missing.length || extra.length || moved.length) process.exit(1);
          JS
          node union.mjs
