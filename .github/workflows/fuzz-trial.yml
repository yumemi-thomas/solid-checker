name: Fuzz trial

# A trial of the differential fuzzer on GitHub-hosted runners: the binaries are
# built once, then the same shard runs twice, cold and then with the first
# run's caches restored, to measure what persisted caches buy on a free
# 4-vCPU runner. Provisioning mirrors scripts/fuzz/vm.sh setup and sync.
#
# The caches' keys hash the size and mtime of every file under the npm
# installs and the Playwright browser (scripts/fuzz/cache.mjs treeStat), so
# the warm job restores those directories from the cold job's tar (mtimes
# kept) instead of reinstalling them. Artifacts, not actions/cache, carry the
# state: the repository's 10 GB Actions cache is CI's.

on:
  push:
    branches: [claude/gha-fuzz-trial]

permissions:
  contents: read

jobs:
  build:
    # ubuntu-22.04 x64 so the release dependency cache main's rust-package job
    # writes (shared-key release-ubuntu-22.04-x64) restores here.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: dtolnay/rust-toolchain@1.99.1
      - run: echo "TSRS_REV=$(sed -n 's/^tsrs_core = .*rev = "\([0-9a-f]*\)".*/\1/p' apps/solid-typefacts/Cargo.toml)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-ubuntu-22.04-x64
          save-if: false
      # Producer with build id dev, the id cargo's [env] gives the checker below.
      - uses: ./.github/actions/typefacts
      # The type checker the fuzzer requires (never tsc from node_modules).
      - id: tsrs-cache
        uses: actions/cache@v4
        with:
          path: ~/tsrs-bin
          key: tsrs-cli-${{ env.TSRS_REV }}-rust-1.99.1-ubuntu-22.04
      - name: Build tsrs CLI
        if: steps.tsrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/yumemi-thomas/tsrs "$RUNNER_TEMP/tsrs"
          git -C "$RUNNER_TEMP/tsrs" checkout -q --detach "$TSRS_REV"
          (cd "$RUNNER_TEMP/tsrs" && cargo +1.99.1 build --release -q -p tsrs_cli)
          mkdir -p ~/tsrs-bin && cp "$RUNNER_TEMP/tsrs/target/release/tsrs" ~/tsrs-bin/
      - name: Build the release checker
        run: cargo +1.99.1 build --release --manifest-path rust/Cargo.toml -p solid-facts-backend --bin solid-checker-rust
      - name: Collect binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bins"
          cp rust/target/release/solid-checker-rust bin/solid-typefacts ~/tsrs-bin/tsrs "$RUNNER_TEMP/bins/"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ runner.temp }}/bins
          retention-days: 3

  cold:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ runner.temp }}/bins
      - name: Installs and Chrome
        run: |
          chmod +x "$RUNNER_TEMP"/bins/*
          (cd scripts/fuzz/install && npm ci --silent)
          (cd scripts/runtime-oracle-install && npm ci --silent)
          (cd packages/cli && bun install --frozen-lockfile --silent)
          (cd scripts/runtime-oracle-install && ./node_modules/.bin/playwright install --with-deps chromium-headless-shell)
      - name: Cache key inputs
        run: |
          node -e 'import("./scripts/fuzz/cache.mjs").then((c) => { const install = "scripts/runtime-oracle-install", fast = "scripts/fuzz/install"; console.log("keys:", JSON.stringify({ installed: c.installedKey({ install, fastInstall: fast }).slice(0, 12), fastTree: c.treeStat(fast + "/node_modules").slice(0, 12), oracleTree: c.treeStat(install + "/node_modules").slice(0, 12), browser: c.browserKey().slice(0, 80) })); })'
      - name: Focus run (cold)
        env:
          SOLID_CHECKER_TSRS_BIN: ${{ runner.temp }}/bins/tsrs
        run: bash .github/fuzz-trial-run.sh
      - name: Pack the warm state
        run: |
          du -sh ~/fuzz-cache ~/fuzz-cache/* scripts/fuzz/install/node_modules scripts/runtime-oracle-install/node_modules packages/cli/node_modules ~/.cache/ms-playwright 2>/dev/null
          find ~/fuzz-cache -type f | wc -l
          tar --format=posix --zstd -cf "$RUNNER_TEMP/warm-state.tar.zst" -C / \
            "${HOME#/}/fuzz-cache" "${HOME#/}/.cache/ms-playwright" \
            "${PWD#/}/scripts/fuzz/install/node_modules" "${PWD#/}/scripts/runtime-oracle-install/node_modules" "${PWD#/}/packages/cli/node_modules"
          ls -lh "$RUNNER_TEMP/warm-state.tar.zst"
      - uses: actions/upload-artifact@v4
        with:
          name: warm-state
          path: ${{ runner.temp }}/warm-state.tar.zst
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-out-cold
          path: |
            ${{ runner.temp }}/fuzz-out/**/*.json
            ${{ runner.temp }}/fuzz-out/**/*.log

  warm:
    needs: cold
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ runner.temp }}/bins
      - uses: actions/download-artifact@v4
        with:
          name: warm-state
          path: ${{ runner.temp }}
      - name: Restore the warm state
        run: |
          chmod +x "$RUNNER_TEMP"/bins/*
          start=$(date +%s)
          tar --zstd -xf "$RUNNER_TEMP/warm-state.tar.zst" -C /
          echo "restore: $(( $(date +%s) - start )) s"
          # The browser's system libraries only (the browser itself is restored).
          (cd scripts/runtime-oracle-install && sudo env PATH=$PATH ./node_modules/.bin/playwright install-deps chromium-headless-shell >/dev/null)
      - name: Cache key inputs
        run: |
          node -e 'import("./scripts/fuzz/cache.mjs").then((c) => { const install = "scripts/runtime-oracle-install", fast = "scripts/fuzz/install"; console.log("keys:", JSON.stringify({ installed: c.installedKey({ install, fastInstall: fast }).slice(0, 12), fastTree: c.treeStat(fast + "/node_modules").slice(0, 12), oracleTree: c.treeStat(install + "/node_modules").slice(0, 12), browser: c.browserKey().slice(0, 80) })); })'
      - name: Focus run (warm)
        env:
          SOLID_CHECKER_TSRS_BIN: ${{ runner.temp }}/bins/tsrs
        run: bash .github/fuzz-trial-run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-out-warm
          path: |
            ${{ runner.temp }}/fuzz-out/**/*.json
            ${{ runner.temp }}/fuzz-out/**/*.log
