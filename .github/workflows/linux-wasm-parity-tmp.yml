# Temporary: runs the WASM parity gate on Linux for one investigation. Delete after use.
name: linux-wasm-parity (temporary)

on:
  push:
    branches: [claude/linux-wasm-parity-24f8d9]

permissions:
  contents: read

jobs:
  wasm-parity-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-wasip1-threads, wasm32-wasip1
      - run: rustup target add wasm32-wasip1-threads wasm32-wasip1 --toolchain 1.99.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/solid-typefacts
          shared-key: wasm-parity-linux-tmp
          save-if: false
      - uses: ./.github/actions/typefacts
      - run: bun install --cwd packages/wasm --ignore-scripts --no-progress --frozen-lockfile
      - run: bun install --cwd packages/cli --ignore-scripts --no-progress --frozen-lockfile
      - run: make wasm-parity
