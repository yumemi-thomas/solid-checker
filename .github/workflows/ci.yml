name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: mkdir -p bin && go build -ldflags "-X main.buildID=ci-${GITHUB_SHA}" -o bin/solid-typefacts ./cmd/solid-typefacts
      - run: cargo test --workspace
        env:
          TYPEFACTS_BUILD_ID: ci-${{ github.sha }}
          TYPEFACTS_TEST_BIN: ${{ github.workspace }}/bin/solid-typefacts
