name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
      - run: make test-rust
      # The two fixture gates: "no finding moved" over every fixture
      # project, and eslint-plugin-solid's own 465 cases with every
      # deviation declared. Both are meaningless unless something runs them.
      - run: make coverage
      - run: make parity
      # The contract drift gate against real installed packages: install the
      # exact pins the checked-in artifacts were generated from, regenerate,
      # and diff. The workspace is already built, so this is one npm install
      # plus three cargo runs.
      - name: Install the pinned contract packages
        run: |
          mkdir -p /tmp/contract-packages
          cd /tmp/contract-packages
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            solid-js-1x@npm:solid-js@1.9.14 \
            solid-js@2.0.0-beta.31 \
            @solidjs/web@2.0.0-beta.31
      - name: Check the contracts against the installed packages
        run: |
          make contracts-check \
            SOLID_1_PACKAGE=/tmp/contract-packages/node_modules/solid-js-1x \
            SOLID_2_PACKAGE=/tmp/contract-packages/node_modules/solid-js \
            SOLIDJS_WEB_PACKAGE=/tmp/contract-packages/node_modules/@solidjs/web

  rust-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@1.97
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build one-version native package
        env:
          SOLID_CHECKER_BUILD_ID: ci-${{ github.sha }}
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          TYPEFACTS_BUILD_ID="$SOLID_CHECKER_BUILD_ID" \
            scripts/build-typefacts.sh "bin/solid-typefacts${extension}"
          TYPEFACTS_BUILD_ID="$SOLID_CHECKER_BUILD_ID" \
            cargo build --release --manifest-path rust/Cargo.toml --workspace
          node scripts/package-rust.mjs \
            --output dist/solid-checker \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --typefacts "bin/solid-typefacts${extension}"
      - name: Smoke-test the installed CLI
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          native="dist/solid-checker/native/${{ matrix.platform }}-${{ matrix.arch }}"
          env -u SOLID_TYPEFACTS_BIN "$native/solid-checker${extension}" \
            --certify --project fixtures/reactive-ir/tracer-corrected/tsconfig.json
          npm pack ./dist/solid-checker --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: solid-checker-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/solid-checker

  wasm-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-wasip1-threads
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/wasm/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: npm ci
        working-directory: packages/wasm
      - run: npm run build
        working-directory: packages/wasm
      - run: npm test
        working-directory: packages/wasm
      - run: npm pack --dry-run
        working-directory: packages/wasm

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sh -n scripts/*.sh
      - run: node --test scripts/*.test.mjs
      - run: jq empty schema/*.json pkg/contracts/bundled/*.json
      # The bundled 1.x contract is generated from the census and the
      # reviewed semantics map; a stale artifact ships wrong semantics
      # compiled into the backend. The drift gate against *real installed*
      # packages (`make contracts-check`) runs in the rust-engine job, which
      # installs the exact pins and regenerates all three artifacts.
      - run: node scripts/generate-bundled-solid1-contract.mjs --check
      - run: make test-cli
