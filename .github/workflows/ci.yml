name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Named, not defaulted to the job name, because the corpus workflows
          # build the same debug workspace and restore this entry.
          shared-key: engine-debug
          # Cache scopes are per branch: a pull request reads main's caches but
          # writes its own, which no later run on main can read. Writing them
          # anyway pushed the repository over the 10GB ceiling, and GitHub
          # evicted the caches on main that every run does read. Restore
          # everywhere, save only where the entry has readers.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every gate below wants the producer, and `make` rebuilt it once per
      # target. This restores it, and the stamp it carries is what makes the
      # `make` dependencies no-ops.
      - uses: ./.github/actions/typefacts
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
      - name: Check single-dialect composition builds
        run: |
          cargo +1.97 check --manifest-path rust/Cargo.toml -p solid-facts-backend --all-targets --no-default-features --features dialect-v1
          cargo +1.97 check --manifest-path rust/Cargo.toml -p solid-facts-backend --all-targets --no-default-features --features dialect-v2
          cargo +1.97 check --manifest-path rust/Cargo.toml -p solid-checker-wasm --all-targets --no-default-features --features dialect-v1
          cargo +1.97 check --manifest-path rust/Cargo.toml -p solid-checker-wasm --all-targets --no-default-features --features dialect-v2
      - run: make test-rust
      # The two fixture gates: "no finding moved" over every fixture
      # project, and eslint-plugin-solid's own 465 cases with every
      # deviation declared. Both are meaningless unless something runs them.
      - run: make coverage
      - run: make parity
      # AGENTS.md's absolute rule, as a gate: no rule's positive case may also
      # be a `tsc` error against the real published Solid typings, and — the
      # half the checker-side declarations added — no rule may be narrowed into
      # silence. Provisioning installs the audited Solid versions and refuses
      # to run on a version mismatch. The harness resolves `typescript` through
      # packages/cli, and the workspace and both binaries are already built by
      # the steps above, so this is one npm install plus the audited installs.
      - run: npm ci --ignore-scripts --prefix packages/cli
      - run: make tsc-oracle
      # The contract drift gate against real installed packages: install the
      # exact pins the checked-in artifacts were generated from, regenerate,
      # and diff. The workspace is already built, so this is one npm install
      # plus three cargo runs.
      - name: Install the pinned contract packages
        run: |
          mkdir -p /tmp/contract-packages
          cd /tmp/contract-packages
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund \
            solid-js-1x@npm:solid-js@1.9.14 \
            solid-js@2.0.0-rc.0 \
            @solidjs/web@2.0.0-rc.0
      - name: Check the contracts against the installed packages
        run: |
          SOLID_V1_SOLID_JS_PACKAGE=/tmp/contract-packages/node_modules/solid-js-1x \
          SOLID_V2_SOLID_JS_PACKAGE=/tmp/contract-packages/node_modules/solid-js \
          SOLID_V2_SOLIDJS_WEB_PACKAGE=/tmp/contract-packages/node_modules/@solidjs/web \
            make contracts-check

  rust-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # The release workflow compiles the same release dependency graph, so
          # it reads this key instead of keeping a second copy of every entry.
          # Keyed on the runner image rather than the platform because the
          # release builds linux-x64 on 22.04 on purpose: a dependency's C
          # objects compiled against a newer image's headers have no business
          # being linked into that artifact. Identical images share; 22.04
          # compiles its own.
          shared-key: release-${{ matrix.runner }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The build id is CI's rather than the commit's on purpose: it is an
      # opaque handshake identity, and a per-commit one made the producer
      # uncacheable across every one of these four platforms. The revision it is
      # built from is still pinned, and it is still linked into both halves of
      # the pairing, so a mismatched producer still fails loudly.
      - uses: ./.github/actions/typefacts
        with:
          build-id: ci
          output: bin/solid-typefacts${{ matrix.platform == 'win32' && '.exe' || '' }}
      - name: Build one-version native package
        env:
          SOLID_CHECKER_BUILD_ID: ci
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          TYPEFACTS_BUILD_ID="$SOLID_CHECKER_BUILD_ID" \
            cargo build --release --manifest-path rust/Cargo.toml --workspace
          node scripts/package-rust.mjs \
            --output dist/solid-checker \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --typefacts "bin/solid-typefacts${extension}"
      - name: Smoke-test the installed CLI
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          native="dist/solid-checker/native/${{ matrix.platform }}-${{ matrix.arch }}"
          env -u SOLID_TYPEFACTS_BIN "$native/solid-checker${extension}" \
            --certify --project fixtures/reactive-ir/tracer-corrected/tsconfig.json
          npm pack ./dist/solid-checker --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: solid-checker-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/solid-checker

  wasm-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-wasip1-threads
      # The action's targets input covers only the toolchain it installs;
      # the build resolves its toolchain through rust-toolchain.toml, which
      # needs its own copy of the target's std.
      - run: rustup target add wasm32-wasip1-threads --toolchain 1.97
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/wasm/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
        working-directory: packages/wasm
      - run: npm run build
        working-directory: packages/wasm
      - run: npm test
        working-directory: packages/wasm
      - run: npm pack --dry-run
        working-directory: packages/wasm

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: sh -n scripts/*.sh
      # The script tests import the oracle harness, which resolves `typescript`
      # through packages/cli. `make test-cli` installs it too, but that runs
      # after this step.
      - run: npm ci --ignore-scripts --prefix packages/cli
      - run: node --test scripts/*.test.mjs
      - run: jq empty schema/*.json
      - run: find pkg/contracts/bundled -type f -name '*.json' -exec jq empty {} +
      # The bundled contracts ship semantics compiled into the backend, so a
      # stale artifact ships wrong semantics. contract-conformance runs three
      # gates: check-bundled-contracts.mjs probes the 2.0 contracts against
      # the exact pinned packages, check-contract-pins.mjs holds every bundled
      # pin to the registry tarball it was audited against (which is what
      # covers the contracts probing never installs), and
      # generate-bundled-solid1-contract.mjs --check catches drift between the
      # 1.x artifact and its inputs. The
      # separate drift gate against *real installed* packages
      # (`make contracts-check`) runs in the rust-engine job, which installs
      # the exact pins and regenerates all three artifacts.
      - run: make contract-conformance
      - run: make test-cli
