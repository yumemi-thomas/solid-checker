name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Main's runs are each
# their own group: every one writes the caches its commit's readers restore.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # A push to main whose tree a pull request's CI already passed on (ADR 0621):
  # its merge ref had this exact tree, so the gates would rerun on the same
  # bytes. Then the jobs below only build, which is what writes main's caches;
  # the tests, the gates and the cache-less jobs are skipped. Anything this
  # cannot show (no record, an expired one, a run from a fork, a run that did
  # not pass, an API error) leaves `tested` empty, and everything runs.
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.lookup.outputs.tested }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # An API error is no record: everything runs, and this job stays green.
          tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || tree=""
          if [ -z "$tree" ]; then echo "no tree for $SHA; running everything"; exit 0; fi
          runs=$(gh api "repos/$REPO/actions/artifacts?name=ci-tested-tree-$tree&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .workflow_run.id') || runs=""
          for run in $runs; do
            passed=$(gh api "repos/$REPO/actions/runs/$run" --jq \
              'select(.path == ".github/workflows/ci.yml" and .event == "pull_request"
                      and .conclusion == "success" and .head_repository.id == .repository.id) | .id') || passed=""
            if [ -n "$passed" ]; then
              echo "tree $tree passed in pull request run $run"
              echo "tested=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "tree $tree has no passing pull request run; running everything"

  rust-engine:
    needs: tested
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      TESTED: ${{ needs.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
          # The producer's reactor clippy (make test-typefacts).
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Named, not defaulted to the job name, because the corpus workflows
          # build the same debug workspace and restore this entry.
          shared-key: engine-debug
          # Cache scopes are per branch: a pull request reads main's caches but
          # writes its own, which no later run on main can read. Writing them
          # anyway pushed the repository over the 10GB ceiling, and GitHub
          # evicted the caches on main that every run does read. Restore
          # everywhere, save only where the entry has readers.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every gate below wants the producer, and `make` rebuilt it once per
      # target. This restores it, and the stamp it carries is what makes the
      # `make` dependencies no-ops.
      - uses: ./.github/actions/typefacts
      # The producer's own workspace: fmt, clippy (native and the wasm32-wasip1
      # reactor) and tests. The invocation transcript suite cross-checks
      # validity against the repository-pinned published TypeScript compiler,
      # which needs node (preinstalled on the runner) and packages/cli installed.
      - run: bun install --cwd packages/cli --ignore-scripts --no-progress --frozen-lockfile
        if: env.TESTED == ''
      - run: make test-typefacts
        if: env.TESTED == ''
      # On a tested tree: what the steps below compile, without running it, so
      # a cache main saves holds the same dependency builds.
      - name: Build what the tested tree's gates build
        if: env.TESTED != ''
        env:
          TYPEFACTS_BUILD_ID: dev
          SOLID_CHECKER_BUILD_ID: dev
        run: |
          cargo +1.99.1 clippy --manifest-path apps/solid-typefacts/Cargo.toml --all-targets
          cargo +1.99.1 test --manifest-path apps/solid-typefacts/Cargo.toml --no-run
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
          cargo test --manifest-path rust/Cargo.toml --workspace --no-run
          make build-checker-debug
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
        if: env.TESTED == ''
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets
        if: env.TESTED == ''
      # solid-facts-backend's default features are exactly dialect-v2, so the
      # workspace clippy above already checks it; only the WASM crate without
      # napi-host is a composition nothing else builds.
      - name: Check the WASM crate without the napi host
        if: env.TESTED == ''
        run: cargo +1.99.1 check --manifest-path rust/Cargo.toml -p solid-checker-wasm --all-targets --no-default-features --features dialect-v2
      - run: make test-rust
        if: env.TESTED == ''
      # The two fixture gates: "no finding moved" over every fixture project,
      # and product-owned semantic/TypeScript ownership over every retained
      # former parity case. Both are meaningless unless something runs them.
      - run: make coverage
        if: env.TESTED == ''
      - run: make ownership-gate
        if: env.TESTED == ''
      # AGENTS.md's absolute rule, as a gate: no rule's positive case may also
      # be a `tsc` error against the real published Solid typings, and — the
      # half the checker-side declarations added — no rule may be narrowed into
      # silence. Provisioning installs the audited Solid versions and refuses
      # to run on a version mismatch. The harness resolves `typescript` through
      # packages/cli, and the workspace and both binaries are already built by
      # the steps above, so this is one Bun install plus the audited installs.
      - run: make tsc-oracle
        if: env.TESTED == ''

  # Unchanged on a tested tree: the release build is the job, and its smoke
  # test takes seconds.
  rust-package:
    needs: tested
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep this tuple identical to publish-npm.yml: main owns the cache
          # that tag-scoped release jobs restore, and the shipped x64 binary
          # must still be compiled against the older supported glibc baseline.
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # The release workflow compiles the same release dependency graph, so
          # it reads this key instead of keeping a second copy of every entry.
          # Keyed on the runner image rather than the platform because a
          # dependency's C objects compiled against a newer image's headers
          # have no business being linked into the portable Linux artifact.
          # The matrix is kept identical to publish-npm.yml so every tag job
          # can restore the entry main owns.
          shared-key: release-${{ matrix.runner }}-${{ matrix.arch }}
          # A macOS ARM64 target cache written by a successful main build has
          # restored Cargo build-script executables that fail with exit 126.
          # Keep dependency downloads cached there, but rebuild target
          # executables on each runner. The publishing workflow must match.
          cache-targets: ${{ matrix.platform != 'darwin' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The build id is CI's rather than the commit's on purpose: it is an
      # opaque handshake identity, and a per-commit one made the producer
      # uncacheable across every one of these four platforms. The revision it is
      # built from is still pinned, and it is still linked into both halves of
      # the pairing, so a mismatched producer still fails loudly.
      - uses: ./.github/actions/typefacts
        with:
          build-id: ci
          output: bin/solid-typefacts${{ matrix.platform == 'win32' && '.exe' || '' }}
      - name: Build one-version native package
        env:
          SOLID_CHECKER_BUILD_ID: ci
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          TYPEFACTS_BUILD_ID="$SOLID_CHECKER_BUILD_ID" \
            cargo build --release --manifest-path rust/Cargo.toml --workspace
          bun scripts/package-rust.mjs \
            --output dist/solid-checker \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --typefacts "bin/solid-typefacts${extension}"
      - name: Smoke-test the installed CLI
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          native="dist/solid-checker/native/${{ matrix.platform }}-${{ matrix.arch }}"
          env -u SOLID_TYPEFACTS_BIN "$native/solid-checker${extension}" \
            --certify --project fixtures/reactive-ir/tracer-corrected/tsconfig.json
          (cd dist/solid-checker && bun pm pack --dry-run)
      - uses: actions/upload-artifact@v4
        with:
          name: solid-checker-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/solid-checker

  wasm-package:
    needs: tested
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      TESTED: ${{ needs.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-wasip1-threads, wasm32-wasip1
      # The action's targets input covers only the toolchain it installs;
      # the build resolves its toolchain through rust-toolchain.toml, which
      # needs its own copy of the target's std.
      - run: rustup target add wasm32-wasip1-threads wasm32-wasip1 --toolchain 1.99.1
      # The owned check's producer reactor is the Type Facts producer built
      # for wasm32-wasip1 (packages/wasm/scripts/build-owned.mjs); its own Cargo
      # workspace needs its own cache.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/solid-typefacts
          # publish-npm.yml restores this default-branch entry. Without an
          # explicit key the action includes the different CI/release job names.
          shared-key: release-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun install --ignore-scripts --no-progress --frozen-lockfile
        working-directory: packages/wasm
      - run: bun run build
        working-directory: packages/wasm
      # Everything the build writes (the gitignored outputs). The WASM is the
      # same on any host, so wasm-parity checks these bytes instead of
      # rebuilding them for six minutes on macOS.
      - uses: actions/upload-artifact@v4
        if: env.TESTED == ''
        with:
          name: wasm-package-build
          path: |
            packages/wasm/browser.js
            packages/wasm/generated.d.ts
            packages/wasm/index.js
            packages/wasm/solid-checker-wasm.wasi-browser.js
            packages/wasm/solid-checker-wasm.wasi.cjs
            packages/wasm/solid-checker-wasm.wasm32-wasi*.wasm
            packages/wasm/wasi-worker*.mjs
            packages/wasm/owned/
          if-no-files-found: error
          retention-days: 1
      - run: bun run test
        if: env.TESTED == ''
        working-directory: packages/wasm
      - run: bun pm pack --dry-run
        if: env.TESTED == ''
        working-directory: packages/wasm

  # The owned check against the native one over the same projects. Local
  # `make verify` skips it for changes confined to the analysis crates (ADR
  # 0379), so every pull request runs it here. On macOS 27 (the `xcode-27`
  # image): the gate's path rows compare the owned WASI layer with the host's
  # own POSIX answers, which differ on Linux (a symlink loop is os error 40,
  # not 62) and on macOS 15 (a trailing slash through a file symlink).
  # It checks wasm-package's built files rather than building its own; only the
  # native checker and the path-control guest are built here.
  # Skipped on a tested tree: it saves only crate downloads (no targets), which
  # a later lockfile's pull requests restore by prefix.
  wasm-parity:
    needs: [tested, wasm-package]
    if: ${{ !cancelled() && needs.wasm-package.result == 'success' && needs.tested.outputs.tested == '' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-wasip1
      # The path-control guest (make build-wasm-parity-guests).
      - run: rustup target add wasm32-wasip1 --toolchain 1.99.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            apps/solid-typefacts
          shared-key: wasm-parity-macos
          # As in rust-package: restored macOS build-script executables have
          # failed with exit 126, so keep downloads cached and rebuild targets.
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/typefacts
      # The package's runtime dependencies and the oracle harness's `typescript`.
      - run: bun install --cwd packages/wasm --ignore-scripts --no-progress --frozen-lockfile
      - run: bun install --cwd packages/cli --ignore-scripts --no-progress --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package-build
          path: packages/wasm
      # The gate alone: `make wasm-parity` would rebuild the package first.
      - run: make wasm-parity-gate

  # Skipped on a tested tree: it writes no cache.
  scripts-and-cli:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.tested == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sh -n scripts/*.sh
      # The script tests import the oracle harness, which resolves `typescript`
      # through packages/cli. `make test-cli` installs it too, but that runs
      # after this step.
      - run: bun install --cwd packages/cli --ignore-scripts --no-progress --frozen-lockfile
      # The oracle's TypeScript 7.1 (ADR 0361) installs apart from packages/cli;
      # tsc-oracle.test.mjs drives it.
      - run: bun scripts/tsc-oracle.mjs provision --dialect typescript
      - run: bun packages/cli/node_modules/vitest/vitest.mjs run --config packages/cli/vitest.config.mjs scripts/*.test.mjs
      # The differential fuzzer's own tests (scripts/fuzz/*.test.mjs), which the glob above does not match. They run under Node (the
      # fuzzer is Node tooling; ssr.mjs needs node:module's stripTypeScriptTypes), on the repository's Node pin. provision.mjs installs
      # their two pinned installs and the pinned Playwright headless shell from the lockfiles; test-lane.mjs fails on a skipped test
      # (only the tsrs-only files may skip, listed in its output, and CI has no tsrs binary).
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun scripts/fuzz/provision.mjs
      - run: bun scripts/fuzz/test-lane.mjs
      - run: jq empty schema/*.json
      - run: make test-cli

  # A pull request's passing run records the tree it tested (its merge ref's),
  # which a push to main with the same tree reads in `tested` above. Only after
  # every job passed; the reader also requires the whole run's success.
  record-tested-tree:
    if: github.event_name == 'pull_request'
    needs: [rust-engine, rust-package, wasm-package, wasm-parity, scripts-and-cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "$tree" > tested-tree
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree
          retention-days: 30
