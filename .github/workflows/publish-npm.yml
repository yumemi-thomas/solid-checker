name: Publish npm package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Prerelease tags (v0.3.0-beta.0) publish under the npm dist-tag named
      # by the prerelease identifier instead of latest.
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vercel's Linux runtime is based on an older glibc than the latest
          # GitHub image. Build the x64 artifact on 22.04 so the published
          # native package remains runnable there as well as on newer Linux.
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
          - runner: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Restores the release dependency build CI already warmed on main
          # under this key. A tag gets its own cache scope that no later run can
          # read, so saving here would only evict entries that have readers.
          # Keyed on the runner image, not just the platform: the release builds
          # linux-x64 on 22.04 on purpose, and a dependency's C objects compiled
          # against a newer image's headers have no business being linked into
          # that artifact. Identical images share; 22.04 builds its own.
          shared-key: release-${{ matrix.runner }}-${{ matrix.arch }}
          # Match CI's cache paths. Restored macOS ARM64 Cargo build-script
          # executables have failed with exit 126 even when produced by the
          # same runner/toolchain, so cache downloads but not rust/target.
          cache-targets: ${{ matrix.platform != 'darwin' }}
          save-if: false
      # A release's build id is its tag, so this producer is a genuinely new
      # binary every time and nothing is cached: what ships is always compiled
      # from the pinned revision in this run.
      - uses: ./.github/actions/typefacts
        with:
          build-id: ${{ github.ref_name }}
          output: bin/solid-typefacts${{ matrix.platform == 'win32' && '.exe' || '' }}
          cache: "false"
      - name: Build native package
        env:
          SOLID_CHECKER_BUILD_ID: ${{ github.ref_name }}
        run: |
          extension=""
          if [[ "${{ matrix.platform }}" == "win32" ]]; then extension=".exe"; fi
          TYPEFACTS_BUILD_ID="$SOLID_CHECKER_BUILD_ID" \
            cargo build --release --manifest-path rust/Cargo.toml --workspace
          bun scripts/package-rust.mjs \
            --output "dist/${{ matrix.platform }}-${{ matrix.arch }}" \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${GITHUB_REF_NAME#v}" \
            --typefacts "bin/solid-typefacts${extension}"
          native="dist/${{ matrix.platform }}-${{ matrix.arch }}/native/${{ matrix.platform }}-${{ matrix.arch }}"
          env -u SOLID_TYPEFACTS_BIN "$native/solid-checker${extension}" \
            --certify --project fixtures/reactive-ir/tracer-corrected/tsconfig.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          targets: wasm32-wasip1-threads
      # The action's targets input covers only the toolchain it installs;
      # the build resolves its toolchain through rust-toolchain.toml, which
      # needs its own copy of the target's std.
      - run: rustup target add wasm32-wasip1-threads --toolchain 1.97
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          # Same reasoning as the native build: a tag's cache scope has no
          # readers, so restore from main's explicitly shared WASM key and do
          # not write.
          shared-key: release-wasm
          save-if: false
      - run: bun install --ignore-scripts --no-progress --frozen-lockfile
        working-directory: packages/wasm
      - name: Build WASI package
        working-directory: packages/wasm
        run: |
          bun pm pkg set "version=${GITHUB_REF_NAME#v}"
          bun run build
          bun run test
          bun pm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: |
            packages/wasm/package.json
            packages/wasm/README.md
            packages/wasm/index.d.ts
            packages/wasm/node.cjs
            packages/wasm/browser-entry.js
            packages/wasm/solid-checker-wasm.wasi.cjs
            packages/wasm/solid-checker-wasm.wasi-browser.js
            packages/wasm/solid-checker-wasm.wasm32-wasi.wasm
            packages/wasm/wasi-worker.mjs
            packages/wasm/wasi-worker-browser.mjs
          if-no-files-found: error

  publish:
    needs: [build, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v4
      # Keep npm only in this publishing job: npm's trusted-publishing flow
      # consumes GitHub's OIDC token. All builds, installs, tests, and package
      # assembly above use Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install Trusted Publishing-compatible npm
        run: npm install --global "npm@^11.15.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: dist/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: dist/wasm
      - name: Assemble and validate package
        run: |
          version="${GITHUB_REF_NAME#v}"
          for target in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            mv "dist/artifacts/npm-${target}" "dist/artifacts/${target}"
          done
          bun scripts/assemble-npm-package.mjs dist/artifacts dist/packages "$version"
          for package in dist/packages/*; do (cd "$package" && bun pm pack --dry-run); done
      - name: Publish native packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in dist/packages/binding-*; do
            name=$(bun -p "require('./$package/package.json').name")
            version=$(bun -p "require('./$package/package.json').version")
            case "$version" in
              *-*) dist_tag=${version#*-}; dist_tag=${dist_tag%%.*};;
              *) dist_tag=latest;;
            esac
            if bun info "$name@$version" version --json >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$package" --tag "$dist_tag"
            fi
          done
      - name: Publish WASM package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(bun -p "require('./dist/wasm/package.json').name")
          version=$(bun -p "require('./dist/wasm/package.json').version")
          case "$version" in
            *-*) dist_tag=${version#*-}; dist_tag=${dist_tag%%.*};;
            *) dist_tag=latest;;
          esac
          if bun info "$name@$version" version --json >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish ./dist/wasm --tag "$dist_tag"
          fi
      - name: Publish portable package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package=./dist/packages/solid-checker
          name=$(bun -p "require('$package/package.json').name")
          version=$(bun -p "require('$package/package.json').version")
          case "$version" in
            *-*) dist_tag=${version#*-}; dist_tag=${dist_tag%%.*};;
            *) dist_tag=latest;;
          esac
          if bun info "$name@$version" version --json >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish "$package" --tag "$dist_tag"
          fi
