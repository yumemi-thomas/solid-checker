name: Fuzz audit

# The fuzzer's full run (every code, the eight grids, the oracle sample) on free GitHub-hosted runners, split by
# scripts/fuzz/audit.mjs: the same programs and the same oracle sample as one local
# `focus.mjs --codes all --grids <all eight>` run (scripts/fuzz/README.md, "The audit on CI").
#
# The recall grids are lean by default (matrix.mjs LEAN_DEMOTED, README "Demoting saturated recall values"): the nightly run
# (16:00 UTC, Monday to Saturday) is lean, the Sunday one (and a manual run with `recall: full`) is full, every recall mount and callback
# form. A report is compared with the latest earlier audit of the same mode, never across modes (audit.mjs `judge`).
#
#   build   the release checker, the Type Facts producer and tsrs, once; the latest earlier audit of this branch (else main)
#   shard   one runner per shard: every grid restricted to shard i of N, no oracle; its oracle candidates
#   pick    the whole run's oracle sample (one --ids manifest per grid) from every shard's candidates, and the oracle jobs
#   oracle  one runner per grid and part: the differential (Chrome against the fast path) on that part of the grid's sample (the recall
#           samples are split over at most 20 jobs, the account's concurrent runners, the largest part split first: audit.mjs oracleParts, ADR 0620)
#   report  the verdict (fails when something needs a look) and the outcomes that moved from the earlier audit
#
# Each shard keeps its warm state between runs: the fuzzer's runtime and type-check caches (keyed by program bytes and the
# tools, never the checker) and the npm installs and browser those keys hash by size and mtime (cache.mjs treeStat), in a pax tar
# that keeps sub-second mtimes. The state is reused only under the same lockfiles and runner image; otherwise the shard installs
# cold. Artifacts carry it, not actions/cache: the repository's 10 GB Actions cache belongs to CI. Each oracle job keeps its own the
# same way (warm-oracle-<grid>-<part>of<parts>): its Chrome and runtime records are keyed by program bytes and the judging sources, never
# the checker (cache.mjs chromeEnvironmentKey), so a night whose generator, oracle and browser are unchanged replays them.

on:
  schedule:
    - cron: "0 16 * * 1-6" # lean: 01:00 JST, Tuesday to Sunday
    - cron: "0 16 * * 0" # full: 01:00 JST on Monday
  workflow_dispatch:
    inputs:
      recall:
        description: Recall grids (lean leaves out the demoted values, full runs every one)
        type: choice
        options: [lean, full]
        default: lean
      shards:
        description: Shards (one runner each; at most 20 run at once)
        default: "40"

permissions:
  contents: read
  actions: read

concurrency:
  group: fuzz-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26.13.0
  RUST_VERSION: 1.99.1

jobs:
  build:
    # ubuntu-22.04 x64 so the release dependency cache CI's rust-package job writes on main restores here.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
      state-key: ${{ steps.plan.outputs.state-key }}
      recall: ${{ steps.plan.outputs.recall }}
      # The latest earlier audit of any mode (its warm state) and of this mode (its rows, in the artifact named).
      earlier: ${{ steps.earlier.outputs.run }}
      earlier-rows: ${{ steps.earlier.outputs.rows-run }}
      earlier-rows-name: ${{ steps.earlier.outputs.rows-name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - id: plan
        run: |
          count="${{ inputs.shards || '40' }}"
          # The Sunday schedule is the weekly full run; every other trigger is lean unless a manual run says full.
          if [ "${{ github.event.schedule }}" = "0 16 * * 0" ]; then recall=full; else recall="${{ inputs.recall || 'lean' }}"; fi
          echo "recall=$recall" >> "$GITHUB_OUTPUT"
          echo "recall grids: $recall"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -e 'console.log(JSON.stringify([...Array(Number(process.argv[1])).keys()]))' "$count")" >> "$GITHUB_OUTPUT"
          key=$(cat scripts/fuzz/install/package-lock.json scripts/runtime-oracle-install/package-lock.json packages/cli/bun.lock | sha256sum | cut -c1-16)
          echo "state-key=$key-node$NODE_VERSION-$ImageOS" >> "$GITHUB_OUTPUT"
          echo "TSRS_REV=$(sed -n 's/^tsrs_core = .*rev = "\([0-9a-f]*\)".*/\1/p' apps/solid-typefacts/Cargo.toml)" >> "$GITHUB_ENV"
      # The latest earlier audit that wrote a report, on this branch or else on main: its warm state (any mode: the fuzzer's caches are
      # keyed by program bytes) and, of this run's mode, its rows (audit-report-lean, audit-report-full; an `audit-report` from before
      # the lean default is a full one).
      - id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          RECALL: ${{ steps.plan.outputs.recall }}
        run: |
          has() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts?name=$2" -q '.total_count' | grep -qv '^0$'; }
          run=""; rows=""; name=""
          for branch in "${{ github.ref_name }}" main; do
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w fuzz-audit.yml -b "$branch" -s completed -L 20 --json databaseId -q '.[].databaseId'); do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              if [ -z "$rows" ]; then
                if has "$id" "audit-report-$RECALL"; then rows=$id; name="audit-report-$RECALL"
                elif [ "$RECALL" = full ] && has "$id" audit-report; then rows=$id; name=audit-report; fi
              fi
              if [ -z "$run" ]; then
                if [ "$rows" = "$id" ] || has "$id" audit-report-lean || has "$id" audit-report-full || has "$id" audit-report; then run=$id; fi
              fi
              [ -n "$run" ] && [ -n "$rows" ] && break 2
            done
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "rows-run=$rows" >> "$GITHUB_OUTPUT"
          echo "rows-name=$name" >> "$GITHUB_OUTPUT"
          echo "earlier audit (warm state): ${run:-none}; earlier $RECALL audit (rows): ${rows:-none}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: release-ubuntu-22.04-x64
          save-if: false
      # Producer with build id dev, the id cargo's [env] gives the checker below.
      - uses: ./.github/actions/typefacts
      - id: tsrs-cache
        uses: actions/cache@v4
        with:
          path: ~/tsrs-bin
          key: tsrs-cli-${{ env.TSRS_REV }}-rust-${{ env.RUST_VERSION }}-ubuntu-22.04
      - name: Build tsrs CLI
        if: steps.tsrs-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/yumemi-thomas/tsrs "$RUNNER_TEMP/tsrs"
          git -C "$RUNNER_TEMP/tsrs" checkout -q --detach "$TSRS_REV"
          (cd "$RUNNER_TEMP/tsrs" && cargo +$RUST_VERSION build --release -q -p tsrs_cli)
          mkdir -p ~/tsrs-bin && cp "$RUNNER_TEMP/tsrs/target/release/tsrs" ~/tsrs-bin/
      - name: Build the release checker
        run: cargo +$RUST_VERSION build --release --manifest-path rust/Cargo.toml -p solid-facts-backend --bin solid-checker-rust
      - run: |
          mkdir -p "$RUNNER_TEMP/bins"
          cp rust/target/release/solid-checker-rust bin/solid-typefacts ~/tsrs-bin/tsrs "$RUNNER_TEMP/bins/"
      - uses: actions/upload-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ runner.temp }}/bins
          retention-days: 3

  shard:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.build.outputs.shards) }}
    env:
      SOLID_CHECKER_TSRS_BIN: ${{ github.workspace }}/../bins/tsrs
      STATE: warm-${{ matrix.index }}-${{ needs.build.outputs.state-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ github.workspace }}/../bins
      - id: warm
        if: needs.build.outputs.earlier != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE }}
          path: ${{ runner.temp }}/state
          run-id: ${{ needs.build.outputs.earlier }}
          github-token: ${{ github.token }}
      - name: Installs and Chrome
        run: |
          chmod +x "$GITHUB_WORKSPACE"/../bins/*
          if [ -f "$RUNNER_TEMP/state/state.tar.zst" ]; then
            tar --zstd -xf "$RUNNER_TEMP/state/state.tar.zst" -C /
            rm -f "$RUNNER_TEMP/state/state.tar.zst"
            echo "warm state restored from run ${{ needs.build.outputs.earlier }}"
            (cd scripts/runtime-oracle-install && sudo env PATH=$PATH ./node_modules/.bin/playwright install-deps chromium-headless-shell >/dev/null)
          else
            echo "no warm state: installing cold"
            (cd scripts/fuzz/install && npm ci --silent)
            (cd scripts/runtime-oracle-install && npm ci --silent)
            (cd packages/cli && bun install --frozen-lockfile --silent)
            (cd scripts/runtime-oracle-install && ./node_modules/.bin/playwright install --with-deps chromium-headless-shell)
          fi
      - name: Shard ${{ matrix.index }} of ${{ needs.build.outputs.count }}
        run: |
          out="$RUNNER_TEMP/out"
          bins="$GITHUB_WORKSPACE/../bins"
          # The running grid's last log line every 3 minutes (focus.mjs prints a grid's line when it ends).
          ( while sleep 180; do f=$(ls -t "$out"/*.log 2>/dev/null | head -1); [ -n "$f" ] && echo "[progress] $(basename "$f"): $(tail -1 "$f" | cut -c1-200)"; done ) &
          status=0
          node scripts/fuzz/audit.mjs shard --shard "${{ matrix.index }}/${{ needs.build.outputs.count }}" --out "$out" \
            --checker-bin "$bins/solid-checker-rust" --typefacts "$bins/solid-typefacts" --grid-timeout 300 --recall "${{ needs.build.outputs.recall }}" \
            -- --cache-dir "$HOME/fuzz-cache" || status=$?
          echo "shard exit $status (the report job judges the run)"
          for f in "$out"/*/cache.json; do node -e 'const c=require(process.argv[1]); console.log(process.argv[1].split("/").at(-2), `runtime ${c.hits}/${c.hits + c.misses}, typecheck ${c.typecheck?.hits}/${(c.typecheck?.hits ?? 0) + (c.typecheck?.misses ?? 0)} hits`)' "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/out/**/*.json
            ${{ runner.temp }}/out/**/*.jsonl
            ${{ runner.temp }}/out/**/*.log
          retention-days: 30
      - name: Pack the warm state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          tar --format=posix --zstd -cf "$RUNNER_TEMP/state/state.tar.zst" -C / \
            "${HOME#/}/fuzz-cache" "${HOME#/}/.cache/ms-playwright" \
            "${GITHUB_WORKSPACE#/}/scripts/fuzz/install/node_modules" "${GITHUB_WORKSPACE#/}/scripts/runtime-oracle-install/node_modules" "${GITHUB_WORKSPACE#/}/packages/cli/node_modules"
          ls -lh "$RUNNER_TEMP/state/state.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.STATE }}
          path: ${{ runner.temp }}/state/state.tar.zst
          compression-level: 0
          retention-days: 7

  pick:
    needs: [build, shard]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - id: pick
        run: |
          node scripts/fuzz/audit.mjs pick --shards "$RUNNER_TEMP/shards" --out "$RUNNER_TEMP/manifests"
          echo "jobs=$(cat "$RUNNER_TEMP/manifests/jobs.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-manifests
          path: ${{ runner.temp }}/manifests
          retention-days: 30

  oracle:
    needs: [build, pick]
    if: always() && needs.pick.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    name: oracle (${{ matrix.grid }} ${{ matrix.part }}/${{ matrix.parts }})
    strategy:
      fail-fast: false
      # One job per grid and part (audit.mjs oracleJobs): { include: [{ grid, part, parts }, ...] }.
      matrix: ${{ fromJSON(needs.pick.outputs.jobs) }}
    env:
      SOLID_CHECKER_TSRS_BIN: ${{ github.workspace }}/../bins/tsrs
      STATE: warm-oracle-${{ matrix.grid }}-${{ matrix.part }}of${{ matrix.parts }}-${{ needs.build.outputs.state-key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: fuzz-binaries
          path: ${{ github.workspace }}/../bins
      - uses: actions/download-artifact@v4
        with:
          name: oracle-manifests
          path: ${{ runner.temp }}/manifests
      - id: warm
        if: needs.build.outputs.earlier != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STATE }}
          path: ${{ runner.temp }}/state
          run-id: ${{ needs.build.outputs.earlier }}
          github-token: ${{ github.token }}
      - name: Installs and Chrome
        run: |
          chmod +x "$GITHUB_WORKSPACE"/../bins/*
          if [ -f "$RUNNER_TEMP/state/state.tar.zst" ]; then
            tar --zstd -xf "$RUNNER_TEMP/state/state.tar.zst" -C /
            rm -f "$RUNNER_TEMP/state/state.tar.zst"
            echo "warm state restored from run ${{ needs.build.outputs.earlier }}"
            (cd scripts/runtime-oracle-install && sudo env PATH=$PATH ./node_modules/.bin/playwright install-deps chromium-headless-shell >/dev/null)
          else
            echo "no warm state: installing cold"
            (cd scripts/fuzz/install && npm ci --silent)
            (cd scripts/runtime-oracle-install && npm ci --silent)
            (cd packages/cli && bun install --frozen-lockfile --silent)
            (cd scripts/runtime-oracle-install && ./node_modules/.bin/playwright install --with-deps chromium-headless-shell)
          fi
      - name: Oracle ${{ matrix.grid }} part ${{ matrix.part }} of ${{ matrix.parts }}
        run: |
          bins="$GITHUB_WORKSPACE/../bins"
          status=0
          node scripts/fuzz/audit.mjs oracle --grid "${{ matrix.grid }}" --part "${{ matrix.part }}/${{ matrix.parts }}" --manifest "$RUNNER_TEMP/manifests/${{ matrix.grid }}.json" \
            --out "$RUNNER_TEMP/oracle/${{ matrix.grid }}" --checker-bin "$bins/solid-checker-rust" --typefacts "$bins/solid-typefacts" \
            -- --cache-dir "$HOME/fuzz-cache" || status=$?
          echo "oracle exit $status (the report job judges the run)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-${{ matrix.grid }}-part${{ matrix.part }}
          path: |
            ${{ runner.temp }}/oracle/${{ matrix.grid }}/*.json
            ${{ runner.temp }}/oracle/${{ matrix.grid }}/*.jsonl
          retention-days: 30
      - name: Pack the warm state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          tar --format=posix --zstd -cf "$RUNNER_TEMP/state/state.tar.zst" -C / \
            "${HOME#/}/fuzz-cache" "${HOME#/}/.cache/ms-playwright" \
            "${GITHUB_WORKSPACE#/}/scripts/fuzz/install/node_modules" "${GITHUB_WORKSPACE#/}/scripts/runtime-oracle-install/node_modules" "${GITHUB_WORKSPACE#/}/packages/cli/node_modules"
          ls -lh "$RUNNER_TEMP/state/state.tar.zst"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.STATE }}
          path: ${{ runner.temp }}/state/state.tar.zst
          compression-level: 0
          retention-days: 7

  report:
    needs: [build, shard, pick, oracle]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: oracle-*
          path: ${{ runner.temp }}/oracle-artifacts
      # The earlier audit of this run's mode (build's `earlier-rows`), so a lean night is compared with a lean audit and the weekly
      # full run with a full one; audit.mjs report also skips a recall grid whose earlier audit was the other mode.
      - id: earlier
        if: needs.build.outputs.earlier-rows != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.earlier-rows-name }}
          path: ${{ runner.temp }}/earlier
          run-id: ${{ needs.build.outputs.earlier-rows }}
          github-token: ${{ github.token }}
      - name: Report
        run: |
          mkdir -p "$RUNNER_TEMP/oracle"
          [ -d "$RUNNER_TEMP/oracle-artifacts/oracle-manifests" ] && mv "$RUNNER_TEMP/oracle-artifacts/oracle-manifests" "$RUNNER_TEMP/oracle/manifests"
          # oracle-<grid>-part<i> is oracle/<grid>/part-<i>/ (audit.mjs readOracle).
          for d in "$RUNNER_TEMP"/oracle-artifacts/oracle-*-part*; do
            [ -d "$d" ] || continue
            name=$(basename "$d"); name=${name#oracle-}
            mkdir -p "$RUNNER_TEMP/oracle/${name%-part*}" && mv "$d" "$RUNNER_TEMP/oracle/${name%-part*}/part-${name##*-part}"
          done
          against=()
          [ -d "$RUNNER_TEMP/earlier/rows" ] && against=(--against "$RUNNER_TEMP/earlier/rows")
          status=0
          node scripts/fuzz/audit.mjs report --shards "$RUNNER_TEMP/shards" --oracle "$RUNNER_TEMP/oracle" --out "$RUNNER_TEMP/report" "${against[@]}" || status=$?
          cat "$RUNNER_TEMP/report/audit.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-${{ needs.build.outputs.recall }}
          path: ${{ runner.temp }}/report
          retention-days: 90
