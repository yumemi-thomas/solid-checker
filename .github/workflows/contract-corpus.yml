name: Package contract corpus

on:
  push:
    branches: [main]
    paths:
      - "rust/crates/solid-reactive-ir/**"
      - "rust/crates/typefacts/**"
      - "apps/solid-typefacts/**"
      - "shims/**"
      - "schema/typefacts-*"
      - "go.mod"
      - "go.sum"
      - "packages/cli/scripts/generate-package-contract.mjs"
      - "scripts/contract-corpus.mjs"
      - "fixtures/package-contracts/torture-*/**"
      - "Makefile"
  pull_request:
    paths:
      - "rust/crates/solid-reactive-ir/**"
      - "rust/crates/typefacts/**"
      - "apps/solid-typefacts/**"
      - "shims/**"
      - "schema/typefacts-*"
      - "go.mod"
      - "go.sum"
      - "packages/cli/scripts/generate-package-contract.mjs"
      - "scripts/contract-corpus.mjs"
      - "fixtures/package-contracts/torture-*/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # This job builds the same debug workspace the CI engine job does, on the
      # same image and toolchain, so it restores that job's dependency cache
      # instead of compiling the dependency graph from nothing. CI's engine job
      # owns the entry; this one only reads it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: engine-debug
          save-if: false
      - uses: ./.github/actions/typefacts
      - name: Regenerate the bounded package-contract corpus
        run: make contract-corpus
