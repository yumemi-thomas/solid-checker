name: Solid Primitives corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same debug workspace as CI's engine job; read that job's dependency
      # cache rather than rebuild the graph on a weekly schedule.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: engine-debug
          save-if: false
      - uses: ./.github/actions/typefacts
      - run: make corpus
