name: TypeFacts producer
description: >
  Restores, or else builds, the repository-owned Type Facts producer.

# The producer is Rust on tsrs (apps/solid-typefacts, its own Cargo workspace).
# The cache key binds its sources, schemas, Cargo.lock (every crate and the tsrs
# revision), the rustc identity, build id, and destination path. Callers install
# the Rust toolchain first (dtolnay/rust-toolchain@1.99.1).
inputs:
  build-id:
    description: >
      Build id linked into the producer. Must equal the id the Rust client is
      built with, or the startup handshake fails. A build id that varies per
      commit (a release tag, a sha) can never hit the cache; pass cache: false
      with one rather than writing an entry no run will read.
    default: dev
  output:
    description: Producer path, relative to working-directory.
    default: bin/solid-typefacts
  working-directory:
    description: >
      Tree holding the local Type Facts source and build script. Defaults to the
      checkout; the performance workflow points it at a merge-base worktree.
    default: .
  cache:
    description: Whether to cache the built binary.
    default: "true"

runs:
  using: composite
  steps:
    # mimalloc (the producer's native allocator) builds with CMake. Hosted
    # runners ship it; install it only where it is missing.
    - shell: bash
      run: |
        if ! command -v cmake >/dev/null 2>&1; then
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y cmake ;;
            macOS) brew install cmake ;;
            Windows) choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y ;;
          esac
        fi
        cmake --version

    # Dependency builds (tsrs is ~80 crates) for a cache miss. A pull request
    # reads main's entry and does not write its own.
    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true'
      with:
        workspaces: ${{ inputs.working-directory }}/apps/solid-typefacts
        shared-key: typefacts-producer
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - id: identity
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        digest=$(node scripts/typefacts-source-identity.mjs --digest --build-id "${{ inputs.build-id }}")
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        rustc_id=$(rustc -vV | (sha256sum 2>/dev/null || shasum -a 256) | cut -c1-16)
        # A cache entry archives the paths it was saved from, so two callers
        # wanting the same binary at two different paths -- the performance
        # workflow wants one in the checkout and one in a merge-base worktree --
        # must not share a key, or the second reports a hit and extracts over
        # the first.
        location=$(printf '%s/%s' "${{ inputs.working-directory }}" "${{ inputs.output }}" |
          tr -c 'A-Za-z0-9._-' '-')
        echo "key=typefacts-${{ runner.os }}-${{ runner.arch }}-rustc-$rustc_id-$digest-${{ inputs.build-id }}-$location" >> "$GITHUB_OUTPUT"

    # Cache paths resolve against the workspace, not against working-directory,
    # so this composes both for the repository checkout and for the performance
    # workflow's merge-base worktree outside it.
    - id: restore
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ${{ inputs.working-directory }}/${{ inputs.output }}
          ${{ inputs.working-directory }}/${{ inputs.output }}.buildinfo
        key: ${{ steps.identity.outputs.key }}

    # On a hit this is the stamp check in build-typefacts.sh and nothing else,
    # which is also what makes a later `make` target that depends on the
    # producer stop rebuilding it.
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TYPEFACTS_BUILD_ID: ${{ inputs.build-id }}
      run: scripts/build-typefacts.sh "${{ inputs.output }}"

    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # A restored binary that cannot run is worse than no cache: it would
        # fail later, inside an unrelated gate.
        if [ ! -x "${{ inputs.output }}" ]; then
          echo "typefacts: ${{ inputs.output }} is missing or not executable" >&2
          exit 1
        fi
        echo "typefacts source ${{ steps.identity.outputs.digest }} (build id ${{ inputs.build-id }})"
